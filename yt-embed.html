<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>YouTube 播放器</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { width: 100%; height: 100%; display: block; }
  #msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ddd; background: #000; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 16px;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="msg"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var videoId = params.get("v") || "";
  var msg = document.getElementById("msg");
  function showMsg(text) {
    msg.textContent = text;
    msg.style.display = "flex";
  }
  function post(data) {
    try { window.parent.postMessage(data, "*"); } catch (e) { /* no parent */ }
  }
  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    showMsg("视频地址不对。");
    post({ type: "ytp-error", code: -1 });
    return;
  }

  var player = null;
  var timer = null;

  function currentTime() {
    try { return typeof player.getCurrentTime === "function" ? player.getCurrentTime() : 0; }
    catch (e) { return 0; }
  }
  function currentRate() {
    try { return typeof player.getPlaybackRate === "function" ? player.getPlaybackRate() : 1; }
    catch (e) { return 1; }
  }
  function currentState() {
    try { return typeof player.getPlayerState === "function" ? player.getPlayerState() : -1; }
    catch (e) { return -1; }
  }

  // Time reports carry the playback rate so the parent can interpolate
  // the playhead between reports instead of stepping at report rate.
  function reportTime() {
    if (!player) return;
    post({ type: "ytp-time", t: currentTime(), state: currentState(), rate: currentRate() });
  }

  function startTimer() {
    if (timer) return;
    timer = setInterval(reportTime, 100);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      videoId: videoId,
      playerVars: {
        rel: 0,
        playsinline: 1,
        cc_load_policy: 1,
        origin: location.origin
      },
      events: {
        onReady: function () {
          post({ type: "ytp-ready" });
          startTimer();
        },
        onStateChange: function (e) {
          // State changes (play / pause / seek / buffering) re-anchor the
          // parent's interpolation immediately, with the position and
          // rate at this exact moment — no waiting for the next tick.
          post({ type: "ytp-state", state: e.data, t: currentTime(), rate: currentRate() });
        },
        onPlaybackRateChange: function (e) {
          post({ type: "ytp-rate", t: currentTime(), rate: e.data });
        },
        onError: function (e) {
          post({ type: "ytp-error", code: e.data });
        }
      }
    });
  };

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object" || !player) return;
    try {
      if (d.type === "ytp-seek" && typeof d.t === "number") {
        player.seekTo(d.t, true);
        player.playVideo();
        reportTime();
      } else if (d.type === "ytp-play") {
        player.playVideo();
        reportTime();
      } else if (d.type === "ytp-pause") {
        player.pauseVideo();
        reportTime();
      }
    } catch (err) { /* player not ready */ }
  });

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () {
    showMsg("播放器没加载出来，检查一下网络再刷新。");
    post({ type: "ytp-error", code: -2 });
  };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
