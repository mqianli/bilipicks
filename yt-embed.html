<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>YouTube 播放器</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #player, #player iframe { width: 100%; height: 100%; display: block; }
  #msg {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ddd; background: #000; font: 15px/1.6 -apple-system, "PingFang SC", sans-serif;
    text-align: center; padding: 16px;
  }
  /* Touch shield for the swipe-back gesture: covers the video area but
     stops 56px short of the bottom, so the player's own control bar
     (progress, play/pause, captions, fullscreen) stays directly
     tappable. Enabled only on touch devices (see script) so desktop
     mouse clicks reach the player untouched. */
  #shield {
    position: absolute; left: 0; right: 0; top: 0; bottom: 56px;
    display: none; z-index: 5; background: transparent; touch-action: none;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="shield"></div>
<div id="msg"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var videoId = params.get("v") || "";
  var msg = document.getElementById("msg");
  function showMsg(text) {
    msg.textContent = text;
    msg.style.display = "flex";
  }
  function post(data) {
    // Framed use (the space's in-app player): report to the parent frame.
    // Standalone-window use (the space's desktop web player opens this
    // page as a popup, because the desktop shell blocks the frame):
    // report to the opener as well. Both targets receive the same
    // messages; each listener validates origin + source window, so a
    // copy landing anywhere else is ignored there.
    try { if (window.parent && window.parent !== window) window.parent.postMessage(data, "*"); } catch (e) { /* no parent */ }
    try { if (window.opener) window.opener.postMessage(data, "*"); } catch (e) { /* no opener */ }
  }
  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    showMsg("视频地址不对。");
    post({ type: "ytp-error", code: -1 });
    return;
  }

  var player = null;
  var timer = null;

  function currentTime() {
    try { return typeof player.getCurrentTime === "function" ? player.getCurrentTime() : 0; }
    catch (e) { return 0; }
  }
  function currentRate() {
    try { return typeof player.getPlaybackRate === "function" ? player.getPlaybackRate() : 1; }
    catch (e) { return 1; }
  }
  function currentState() {
    try { return typeof player.getPlayerState === "function" ? player.getPlayerState() : -1; }
    catch (e) { return -1; }
  }
  function currentDuration() {
    try { return typeof player.getDuration === "function" ? player.getDuration() : 0; }
    catch (e) { return 0; }
  }

  // Time reports carry the playback rate so the parent can interpolate
  // the playhead between reports instead of stepping at report rate,
  // and the duration so the parent can draw a progress bar.
  function reportTime() {
    if (!player) return;
    post({ type: "ytp-time", t: currentTime(), state: currentState(), rate: currentRate(), dur: currentDuration() });
  }

  function startTimer() {
    if (timer) return;
    timer = setInterval(reportTime, 100);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("player", {
      videoId: videoId,
      playerVars: {
        rel: 0,
        playsinline: 1,
        cc_load_policy: 1,
        origin: location.origin
      },
      events: {
        onReady: function () {
          post({ type: "ytp-ready" });
          startTimer();
        },
        onStateChange: function (e) {
          // State changes (play / pause / seek / buffering) re-anchor the
          // parent's interpolation immediately, with the position and
          // rate at this exact moment — no waiting for the next tick.
          post({ type: "ytp-state", state: e.data, t: currentTime(), rate: currentRate() });
        },
        onPlaybackRateChange: function (e) {
          post({ type: "ytp-rate", t: currentTime(), rate: e.data });
        },
        onError: function (e) {
          post({ type: "ytp-error", code: e.data });
        }
      }
    });
  };

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || typeof d !== "object" || !player) return;
    try {
      if (d.type === "ytp-seek" && typeof d.t === "number") {
        player.seekTo(d.t, true);
        player.playVideo();
        reportTime();
      } else if (d.type === "ytp-play") {
        player.playVideo();
        reportTime();
      } else if (d.type === "ytp-pause") {
        player.pauseVideo();
        reportTime();
      } else if (d.type === "ytp-set-rate" && typeof d.rate === "number" && d.rate > 0) {
        // Playback-rate command from the parent's intensive-listening
        // controls. onPlaybackRateChange confirms back with `ytp-rate`.
        player.setPlaybackRate(d.rate);
        reportTime();
      }
    } catch (err) { /* player not ready */ }
  });

  // ---------------------------------------------------------------
  // Swipe-back gesture channel. A gesture that starts on the video
  // belongs to this document (and the YT iframe nested inside it) —
  // the parent page can never see it. The transparent #shield over
  // the video area (stopping 56px short of the bottom, so the
  // player's own control bar stays directly tappable) recognizes the
  // SAME iOS-style edge gesture the parent page uses: the touch
  // starts within 24px of the left edge and slides right more than
  // 60px with horizontal clearly dominating vertical (dx > 2×|dy|).
  // On recognition it posts `ytp-swipe-back`; the parent runs its
  // back action (open layer closes first, else leave the player).
  // A plain tap on the shield still belongs to the player: it toggles
  // play/pause through the API, exactly what a tap on the video does.
  // The shield is enabled only on touch devices, so desktop mouse
  // clicks reach the player untouched.
  // ---------------------------------------------------------------
  var shield = document.getElementById("shield");
  if (shield && ("ontouchstart" in window || navigator.maxTouchPoints > 0)) {
    shield.style.display = "block";
    var gTracking = false;
    var gFired = false;
    var gStartX = 0;
    var gStartY = 0;
    var EDGE_PX = 24;
    var THRESHOLD_PX = 60;
    shield.addEventListener("touchstart", function (e) {
      var t = e.touches.length === 1 ? e.touches[0] : null;
      gTracking = !!t && t.clientX <= EDGE_PX;
      gFired = false;
      if (t) {
        gStartX = t.clientX;
        gStartY = t.clientY;
      }
    }, { passive: true });
    shield.addEventListener("touchmove", function (e) {
      if (!gTracking || gFired) return;
      var t = e.touches[0];
      if (!t) return;
      var dx = t.clientX - gStartX;
      var dy = t.clientY - gStartY;
      if (dx > THRESHOLD_PX && dx > Math.abs(dy) * 2) {
        gFired = true;
        gTracking = false;
        post({ type: "ytp-swipe-back" });
      } else if (Math.abs(dy) > 48 && Math.abs(dy) > Math.abs(dx)) {
        // Vertical-dominant move: not a back swipe — abandon.
        gTracking = false;
      }
    }, { passive: true });
    shield.addEventListener("touchend", function (e) {
      gTracking = false;
      if (gFired) return;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - gStartX;
      var dy = t.clientY - gStartY;
      // Plain tap: the player's own tap behaviour, via the API.
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && player) {
        try {
          if (currentState() === 1) player.pauseVideo();
          else player.playVideo();
          reportTime();
        } catch (err) { /* player not ready */ }
      }
    });
    shield.addEventListener("touchcancel", function () {
      gTracking = false;
    });
  }

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function () {
    showMsg("播放器没加载出来，检查一下网络再刷新。");
    post({ type: "ytp-error", code: -2 });
  };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
